name: Bug Report
description: Report a continuity rule false-positive, epistemic leak, or simulation bug
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the issue
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction
      description: Commands or world events to reproduce the issue
    validations:
      required: true
