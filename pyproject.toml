[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loresim"
version = "0.1.0"
description = "LoreSim: Hybrid Rust + Python Epistemic World, Narrative Continuity Compiler, and Zero-Cost 60 FPS 2D NPC Theater Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sourik Adhikary" }]
keywords = [
    "epistemic-logic",
    "world-simulation",
    "npc-engine",
    "narrative-continuity",
    "plot-hole-detector",
    "multi-agent",
    "story-compiler",
    "game-ai",
    "sqlite",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
loresim = "loresim.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/SourikAdhikary/loresim"
Repository = "https://github.com/SourikAdhikary/loresim"
Issues = "https://github.com/SourikAdhikary/loresim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loresim = ["py.typed", "interfaces/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
